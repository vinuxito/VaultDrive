name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vaultdrive"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/vaultdrive?sslmode=disable
      JWT_SECRET: quantix-ci-secret-key-minimum-32-characters-long
      PRODUCT_NAME: QuantiX Drive
      PRODUCT_SLUG: quantix-drive
      BASE_PATH: /quantix/
      AGENT_KEY_PREFIX: qx_ak
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8082

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vaultdrive_client/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run database migrations
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          goose -dir sql/schema postgres "$DB_URL" up

      - name: Install frontend dependencies
        working-directory: vaultdrive_client
        run: npm ci

      - name: Run backend tests
        run: go test -race ./...

      - name: Run backend vet
        run: go vet ./...

      - name: Run frontend unit tests
        working-directory: vaultdrive_client
        run: npm test

      - name: Type-check frontend
        working-directory: vaultdrive_client
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: vaultdrive_client
        run: npm run build

      - name: Verify frontend build output base path
        run: |
          test -f vaultdrive_client/dist/index.html
          grep -q '/quantix/' vaultdrive_client/dist/index.html

      - name: Build backend binary
        run: go build -ldflags="-w -s" -o quantix-drive .

  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
