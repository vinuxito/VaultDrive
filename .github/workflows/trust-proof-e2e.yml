name: Trust Proof E2E

on:
  push:
    branches: [main]
    paths:
      - "vaultdrive_client/**"
      - "*.go"
      - "sql/**"
      - ".github/workflows/trust-proof-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "vaultdrive_client/**"
      - "*.go"
      - "sql/**"
      - ".github/workflows/trust-proof-e2e.yml"
  workflow_dispatch:

jobs:
  trust-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vaultdrive"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/vaultdrive?sslmode=disable
      JWT_SECRET: trust-proof-e2e-secret-key-minimum-32-characters
      PRODUCT_NAME: ABRN Drive
      PRODUCT_SLUG: abrn-drive
      AGENT_KEY_PREFIX: abrnak
      VITE_PRODUCT_NAME: ABRN Drive
      VITE_API_URL: /api
      VITE_BASE_PATH: /abrn
      VITE_AGENT_KEY_PREFIX: abrnak

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vaultdrive_client/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        working-directory: vaultdrive_client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: vaultdrive_client
        run: npx playwright install chromium --with-deps

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0

      - name: Run database migrations
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          goose -dir sql/schema postgres "$DB_URL" up

      - name: Run frontend unit tests
        working-directory: vaultdrive_client
        run: npm test

      - name: Check frontend and browser test contracts
        working-directory: vaultdrive_client
        run: |
          npm run lint
          npm run typecheck
          npm run test:e2e:config

      - name: Run backend tests
        run: go test ./...

      - name: Prepare isolated browser runtime
        run: |
          mkdir -p "$RUNNER_TEMP/abrn-e2e/runtime/vaultdrive_client" "$RUNNER_TEMP/abrn-e2e/uploads"
          cd vaultdrive_client
          npm run build -- --mode test --outDir "$RUNNER_TEMP/abrn-e2e/dist" --emptyOutDir
          cd ..
          go build -o "$RUNNER_TEMP/abrn-e2e/abrndrive" .
          ln -s "$RUNNER_TEMP/abrn-e2e/dist" "$RUNNER_TEMP/abrn-e2e/runtime/vaultdrive_client/dist"
          cd "$RUNNER_TEMP/abrn-e2e/runtime"
          LISTEN_HOST=127.0.0.1 PORT=8090 BASE_PATH=/abrn/ UPLOAD_DIR="$RUNNER_TEMP/abrn-e2e/uploads" ENABLE_ARGON2ID=true "$RUNNER_TEMP/abrn-e2e/abrndrive" > "$RUNNER_TEMP/abrn-e2e/backend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/ready; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run Playwright trust proof suite
        working-directory: vaultdrive_client
        env:
          E2E_BASE_URL: http://127.0.0.1:8090/abrn/
          E2E_API_BASE_URL: http://127.0.0.1:8090/api
        run: npm run test:e2e:external

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vaultdrive_client/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: vaultdrive_client/test-results/
          retention-days: 7
