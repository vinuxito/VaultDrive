# Reboot-survival hardening for abrndrive.service (drop-in; base unit untouched).
# Installed by ABRN-Drive/deploy/systemd/install-hardening.sh — idempotent.
#
# Goal: the backend must come up cleanly after every VPS reboot, even when
# PostgreSQL is slow to accept connections on a cold boot.
[Unit]
# Postgres must be up, and order ourselves after the network is actually online.
Requires=postgresql.service
After=network-online.target postgresql.service
Wants=network-online.target
# Never give up: disabling the start-rate limiter means a slow Postgres can
# never permanently park this service in "failed". It retries forever.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
# Gate startup on Postgres actually accepting connections (no crash-loop noise).
# Helper lives in the deploy tree so the gate needs no root to install/update.
ExecStartPre=/lamp/www/ABRN-Drive/deploy/systemd/wait-for-postgres.sh 120
