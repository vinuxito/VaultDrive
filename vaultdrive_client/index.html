<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="%VITE_PRIMARY_COLOR%" />
  <meta name="description" content="Zero-knowledge encrypted cloud drive. Browser-side AES-256-GCM encryption, scoped agent access, and full auditability." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="manifest" href="/manifest.json" />
  <title>%VITE_PRODUCT_NAME%</title>
</head>

<body>
  <!-- Skin bootstrap: sets data-theme before React mounts to prevent FOUC -->
  <script>
    (function () {
      var VALID = ["quantix", "light", "dark", "cyberpunk", "elegant", "business"];
      var DARK  = ["quantix", "dark", "cyberpunk", "elegant"];
      var skin  = localStorage.getItem("quantixdrive-skin");
      if (!skin || VALID.indexOf(skin) < 0) {
        var legacy = localStorage.getItem("vaultdrive-ui-theme");
        skin = legacy === "dark" ? "dark" : legacy === "light" ? "light" : "quantix";
      }
      document.documentElement.setAttribute("data-theme", skin);
      if (DARK.indexOf(skin) >= 0) document.documentElement.classList.add("dark");
    })();
  </script>
  <a href="#root" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg">Skip to content</a>
  <div id="root" role="main"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
