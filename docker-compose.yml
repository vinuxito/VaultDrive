services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultdrive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "vaultdrive"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./sql:/app/sql
    environment:
      DB_URL: postgres://postgres:postgres@postgres:5432/vaultdrive?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        go install github.com/pressly/goose/v3/cmd/goose@latest &&
        /go/bin/goose -dir sql/schema postgres \"$$DB_URL\" up
      "

  quantix-drive:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantix-drive:local
    environment:
      PORT: "8090"
      DB_URL: postgres://postgres:postgres@postgres:5432/vaultdrive?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-minimum-32-characters-long}
      PRODUCT_NAME: "ABRN Drive"
      PRODUCT_SLUG: abrn-drive
      BASE_PATH: /abrn/
      AGENT_KEY_PREFIX: abrnak
      PUBLIC_BASE_URL: http://localhost:8090
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8090
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      ENABLE_ARGON2ID: "false"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
