services:
  migrate:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./sql:/app/sql
    env_file:
      - .env
      - .env.runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "
        go install github.com/pressly/goose/v3/cmd/goose@latest &&
        /go/bin/goose -dir sql/schema postgres \"$$DB_URL\" up
      "

  quantix-drive:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantix-drive:local
    env_file:
      - .env
      - .env.runtime
    environment:
      PORT: "8082"
      PRODUCT_NAME: "ABRN Drive"
      PRODUCT_SLUG: abrn-drive
      BASE_PATH: /abrn/
      AGENT_KEY_PREFIX: abrnak
      PUBLIC_BASE_URL: https://abrndrive.filemonprime.net
      CORS_ALLOWED_ORIGINS: https://abrndrive.filemonprime.net,http://localhost:5173
      ADMIN_BOOTSTRAP_EMAILS: filemon@abrn.mx,v.cazares@abrn.mx
      ENABLE_ARGON2ID: "false"
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./uploads:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
